name: Build Mochi Study Android APK
on:
  workflow_dispatch:
  push:
    branches: [ android-widget-foundation ]
    paths: [ 'app/**', 'build.gradle', 'settings.gradle', 'index.html', '.github/workflows/android-apk.yml' ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore stable Mochi Study signing key
        env:
          KEYSTORE_B64: ${{ secrets.MOCHI_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MOCHI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOCHI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MOCHI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret for stable APK signing: $name. See repository Settings > Secrets and variables > Actions."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/mochi-study-signing.jks"
          echo "MOCHI_KEYSTORE_PATH=$RUNNER_TEMP/mochi-study-signing.jks" >> "$GITHUB_ENV"
          echo "MOCHI_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "MOCHI_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "MOCHI_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mochi-study-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
